name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # build.zig refuses any compiler but 0.17 on purpose: that version moved the whole std.Io surface, so a
      # different minor does not build this code. The gitignore dependency is fetched from its tag, so this job
      # needs no sibling checkout.
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.17.0

      - name: Test
        run: zig build test --summary all

      - uses: oven-sh/setup-bun@v2

      # The integration tests drive the built CLI: hex batch ids, the reconcile range, and the optional baseline.
      - name: Batch history, end to end
        run: |
          zig build -Doptimize=ReleaseFast
          bun test test
